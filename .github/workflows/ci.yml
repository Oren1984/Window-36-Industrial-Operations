name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.4
      - run: ruff format --check .
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: w36
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: window36_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U w36" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CI: "true"
      W36_TEST_DATABASE_URL: postgresql+psycopg://w36:ci-only@localhost:5432/window36_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Database integration tests
        run: pytest tests/integration -q
      - name: Streamlit UI workflow tests
        run: pytest tests/ui -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependency scan (pip-audit)
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r requirements.txt --strict

  image-and-smoke:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose build
      - name: Image scan (Trivy, HIGH/CRITICAL with available fixes)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" aquasec/trivy:0.56.2 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /src/.trivyignore window36-app:1.0
      - name: Docker Compose smoke test
        run: bash scripts/compose_smoke.sh
